<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="./style.css">
  </head>

  <body>
    <main class="game">
      <header class="game-header">
        <h1>Tic-Tac-Toe</h1>

        <p
          class="status"
          aria-live="polite"
        >
          Human's turn
        </p>
      </header>

      <section
        class="board"
        aria-label="Tic-Tac-Toe board"
      >
        <button
          class="cell"
          data-row="0"
          data-col="0"
          aria-label="Row 1, Column 1"
        ></button>

        <button
          class="cell"
          data-row="0"
          data-col="1"
          aria-label="Row 1, Column 2"
        ></button>

        <button
          class="cell"
          data-row="0"
          data-col="2"
          aria-label="Row 1, Column 3"
        ></button>

        <button
          class="cell"
          data-row="1"
          data-col="0"
          aria-label="Row 2, Column 1"
        ></button>

        <button
          class="cell"
          data-row="1"
          data-col="1"
          aria-label="Row 2, Column 2"
        ></button>

        <button
          class="cell"
          data-row="1"
          data-col="2"
          aria-label="Row 2, Column 3"
        ></button>

        <button
          class="cell"
          data-row="2"
          data-col="0"
          aria-label="Row 3, Column 1"
        ></button>

        <button
          class="cell"
          data-row="2"
          data-col="1"
          aria-label="Row 3, Column 2"
        ></button>

        <button
          class="cell"
          data-row="2"
          data-col="2"
          aria-label="Row 3, Column 3"
        ></button>
      </section>

      <button
        class="restart"
        type="button"
      >
        Restart Game
      </button>
    </main>

    <script src="./script-refactor.js"></script>
  </body>
</html>
